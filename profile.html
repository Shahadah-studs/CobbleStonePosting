<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobbleStonePosting - Settings</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
  <form id="profile-form" class="bg-gray-900 border border-gray-800 p-6 rounded-xl shadow-xl w-full max-w-md space-y-4">
    <h2 class="text-2xl font-black text-amber-500">Update Profile</h2>
    <div>
      <label class="block text-xs uppercase text-gray-400 mb-1 font-bold">Username</label>
      <input type="text" id="profile-username" required class="w-full p-2.5 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-amber-500">
    </div>
    <div>
      <label class="block text-xs uppercase text-gray-400 mb-1 font-bold">Avatar Image URL</label>
      <input type="text" id="profile-avatar" class="w-full p-2.5 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-amber-500">
    </div>
    <div class="flex gap-2">
      <button type="submit" class="flex-1 p-2.5 rounded-lg bg-amber-600 hover:bg-amber-500 font-bold transition text-sm">Save Changes</button>
      <a href="/index.html" class="p-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm text-center block flex-1">Back to Hub</a>
    </div>
  </form>

  <script type="module" src="/src/profile.ts"></script>
</body>
</html>
