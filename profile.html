<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobbleStonePosting - Settings</title>
  <link rel="stylesheet" href="src/style.css">
  
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
  <form id="profile-form" class="glass-panel p-8 rounded-2xl w-full max-w-md space-y-4">
    <h2 class="text-2xl font-black text-amber-500 tracking-tight mb-2">Update Profile</h2>
    <div>
      <label class="block text-xs uppercase text-gray-400 mb-1.5 font-bold tracking-wider">Username Token</label>
      <input type="text" id="profile-username" required class="input-field">
    </div>
    <div>
      <label class="block text-xs uppercase text-gray-400 mb-1.5 font-bold tracking-wider">Avatar image URL</label>
      <input type="text" id="profile-avatar" class="input-field" placeholder="https://example.com">
    </div>
    <div class="flex gap-2 pt-2">
      <button type="submit" class="flex-1 btn-primary text-sm">Save Changes</button>
      <a href="/index.html" class="p-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-bold uppercase tracking-wider text-center block flex-1 flex items-center justify-center border border-gray-700">Cancel</a>
    </div>
  </form>

  <script type="module" src="src/profile.ts"></script>
</body>
</html>
