<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Wrong Turn Explorer | MineSocial</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f3f4f6;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --accent-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            z-index: 10;
        }

        /* Floating animation for the Explorer SVG */
        .svg-wrapper {
            width: 280px;
            height: 280px;
            margin: 0 auto 2rem;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(59, 130, 246, 0.2));
        }

        h1 {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(5b, 130, 246, 0.4);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5b, 130, 246, 0.6);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Subtle starry space ambient background */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 20px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.3;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
       
        <div class="svg-wrapper">
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="100%" height="100%">
                <!-- Compass / Map Base -->
                <circle cx="12" cy="12" r="10" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
                <path d="M12 2L14 9H10L12 2z" fill="#ef4444"/>
                <path d="M12 22L10 15H14L12 22z" fill="#94a3b8"/>
                <circle cx="12" cy="12" r="1.5" fill="#fff"/>
                
               
                <path d="M12 5 C 6 5, 4 12, 8 15 C 10 16.5, 13 15, 16 18" fill="none" stroke="#3b82f6" stroke-width="0.7" stroke-dasharray="2,2"/>
                
           
                <path d="M12 8v4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="12" cy="15" r="0.75" fill="#f59e0b"/>
                
            
                <path d="M19 5l-3 3M16 5l3 3" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>
            </svg>
        </div>

        <h1>404</h1>
        <h2>Wrong turn, explorer!</h2>
        <p>It looks like you've wandered completely off the MineSocial grid. The page you are looking for has been moved, deleted, or never existed in this feeds sector.</p>
        
      
        <a href="/" class="btn">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            Return to Feed
        </a>
    </div>

</body>
</html>
