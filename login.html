<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobbleStonePosting - Gate</title>
  <link rel="stylesheet" href="src/style.css">
  <script src="https://jsdelivr.net"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md text-center mb-4">
    <h1 class="text-5xl font-extrabold tracking-tighter text-amber-500 mb-1 drop-shadow-md">CobbleStone</h1>
    <p class="text-gray-400 text-xs tracking-wide uppercase font-bold" id="auth-subtitle">Ecosystem Authentication Gate</p>
  </div>
  
  <form id="auth-form" class="glass-panel p-8 rounded-2xl w-full max-w-md space-y-4">
    <div id="auth-error" class="hidden bg-red-950/80 border border-red-800 text-red-300 p-3 rounded-xl text-center font-mono text-xs"></div>
    
    <input type="text" id="auth-username" placeholder="Choose Ecosystem Username" class="input-field hidden">
    <input type="email" id="auth-email" placeholder="Email Address" required class="input-field">
    <input type="password" id="auth-password" placeholder="Account Password" required class="input-field">
    
    <button type="submit" id="auth-submit-btn" class="w-full btn-primary mt-2">Access Hub</button>
  </form>
  
  <button id="auth-toggle-btn" class="mt-6 text-xs text-gray-400 hover:text-amber-400 tracking-wider uppercase font-semibold transition">Need an identity? Sign Up</button>

  <script type="module" src="src/login.ts"></script>
</body>
</html>
