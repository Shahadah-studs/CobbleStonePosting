<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobbleStonePosting - Gate</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col items-center justify-center min-h-screen p-4">
  <h1 class="text-4xl font-black text-amber-500 mb-2">CobbleStonePosting</h1>
  <p class="text-gray-400 mb-6" id="auth-subtitle">Sign in to access the hub</p>
  
  <form id="auth-form" class="bg-gray-900 border border-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md space-y-4">
    <div id="auth-error" class="hidden bg-red-950 border border-red-800 text-red-400 p-3 rounded-lg text-center font-mono text-sm"></div>
    
    <input type="text" id="auth-username" placeholder="Username (Sign Up Only)" class="hidden w-full p-2.5 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-amber-500">
    <input type="email" id="auth-email" placeholder="Email Address" required class="w-full p-2.5 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-amber-500">
    <input type="password" id="auth-password" placeholder="Password" required class="w-full p-2.5 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-amber-500">
    
    <button type="submit" id="auth-submit-btn" class="w-full p-2.5 rounded-lg bg-amber-600 hover:bg-amber-500 font-bold transition">Log In</button>
  </form>
  <button id="auth-toggle-btn" class="mt-4 text-sm text-gray-400 hover:text-white underline">Need an account? Sign Up</button>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
