<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineSocial - Create & Share</title>
 <link rel="icon" type="image/png" href="/logo.png?v=2"> 
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="min-h-screen p-6">
  <!-- Header Bar -->
  <header class="mc-panel flex justify-between items-center mb-6 max-w-4xl mx-auto">
    <h1 class="text-xl text-amber-500 tracking-tight flex items-center gap-2">MINESOCIAL</h1>
    <div class="flex items-center gap-4">
      <div id="user-badge-container"></div>
      <a href="profile.html" class="btn-primary"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user preview-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      <a id="nav-admin-btn" href="admin.html" class="btn-danger hidden"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-user preview-icon"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M6.376 18.91a6 6 0 0 1 11.249.003"/><circle cx="12" cy="11" r="4"/></svg></a>
      <button id="logout-btn" class="logout-x-btn" title="Disconnect">✕</button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto xp-divider"></div>

  <!-- Posting Form with ImgBB Integration -->
  <main class="max-w-4xl mx-auto space-y-6">
    <form id="post-form" class="mc-panel shadow-xl">
      <div class="input-header">POSTS FEED:</div>
      <textarea id="post-content" placeholder="Type a post or share a link here..." maxlength="500" required class="input-field mb-3 resize-none h-24" rows="3"></textarea>
      
      <div class="flex justify-between items-center">
        <!-- ImgBB Upload Control Area -->
        <div class="flex items-center gap-2">
          <span id="upload-status" class="input-header" style="color: #aaaaaa !important; margin: 0;">[IMAGE: NONE]</span>
          <input type="file" id="post-file-input" accept="image/png, image/jpeg, image/webp" style="display: none;">
          <button type="button" onclick="document.getElementById('post-file-input').click()" class="btn-primary" style="font-size: 0.55rem; padding: 0.5rem 0.8rem; background-color: #5c5c5c;">+ UPLOAD</button>
        </div>
        
        <button type="submit" class="btn-primary">POST</button>
      </div>
    </form>

    <!-- Post Feed Target Container -->
    <div id="feed-container" class="space-y-4"></div>
  </main>

  <script type="module" src="src/hub.ts"></script>
</body>
</html>
