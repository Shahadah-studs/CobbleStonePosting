<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobbleStonePosting - Admin panel</title>
  
  <style>
    @import url('https://googleapis.com');

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1c0a0a 0%, #090303 100%); /* Crimson/Nether red void accent */
      color: #f3f4f6;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    /* Force Minecraft Pixel Font globally on headings, buttons, and system metrics */
    h1, h2, .admin-subtitle, .btn-back, .btn-action, .report-reason-title {
      font-family: 'Press Start 2P', monospace !important;
      image-rendering: pixelated;
      text-shadow: 2px 2px 0px #000000;
    }

    /* Matrix Top Panel Layout */
    .admin-header {
      background-color: #2e2e2e;
      border: 4px solid #141414;
      box-shadow: inset -4px -4px 0px #1a1a1a, inset 4px 4px 0px #4a4a4a;
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      max-w: 72rem;
      margin-left: auto;
      margin-right: auto;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.5rem;
      color: #ef4444; /* High-alert Operator Red */
      margin: 0 0 0.35rem 0;
      letter-spacing: -0.05em;
    }

    .admin-subtitle {
      font-size: 0.55rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.025em;
      margin: 0;
    }

    /* Standard Grey Return Button */
    .btn-back {
      background-color: #7c7c7c;
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.75rem 1.25rem;
      border: 3px solid #000000;
      box-shadow: inset -3px -3px 0px #4a4a4a, inset 3px 3px 0px #b8b8b8;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
    }

    .btn-back:hover {
      background-color: #5c5c5c;
      box-shadow: inset -3px -3px 0px #333333, inset 3px 3px 0px #999999;
    }

    /* Grid Layout Split Columns */
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 2rem;
      max-width: 72rem;
      margin-left: auto;
      margin-right: auto;
    }

    @media (min-width: 1024px) {
      .matrix-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Section Control Windows (Deepslate Slate look) */
    .mc-panel {
      background-color: #2e2e2e;
      border: 4px solid #141414;
      box-shadow: inset -4px -4px 0px #1a1a1a, inset 4px 4px 0px #4a4a4a;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    h2 {
      font-size: 0.75rem;
      margin: 0 0 1.25rem 0;
      border-bottom: 3px solid #141414;
      padding-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .title-users { color: #facc15; } /* Gold Directory Heading */
    .title-reports { color: #f87171; } /* Light Red Flags Heading */

    .scroll-box {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* User Row Layout Asset Box */
    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a1a;
      border: 3px solid #141414;
      box-shadow: inset -2px -2px 0px #0e0e0e, inset 2px 2px 0px #383838;
      padding: 0.75rem 1rem;
      box-sizing: border-box;
    }

    .username-txt {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .banned-strike {
      color: #ef4444 !important;
      text-decoration: line-through;
      font-family: monospace;
    }

    /* Execution Ban/Unban Danger Button styling */
    .btn-action {
      background-color: #b02e2e;
      color: #ffffff;
      font-size: 0.55rem;
      padding: 0.55rem 0.85rem;
      border: 3px solid #000000;
      box-shadow: inset -2px -2px 0px #5c1414, inset 2px 2px 0px #f06a6a;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-action:hover {
      background-color: #ff4747;
      box-shadow: inset -2px -2px 0px #941111, inset 2px 2px 0px #ffa8a8;
    }

    .btn-unban {
      background-color: #2c6d2c !important;
      box-shadow: inset -2px -2px 0px #184218, inset 2px 2px 0px #5eead4 !important;
    }
    .btn-unban:hover {
      background-color: #22c55e !important;
    }

    /* Report Log Presentation Container */
    .report-card {
      background-color: #3c3c3c;
      border: 3px solid #1d1d1d;
      box-shadow: inset -2px -2px 0px #242424, inset 2px 2px 0px #505050;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-sizing: border-box;
    }

    .report-reason-title {
      font-size: 0.55rem;
      color: #f87171;
      margin: 0;
      text-transform: uppercase;
    }

    .report-quote-block {
      background-color: #000000;
      border: 2px solid #555555;
      color: #d1d5db;
      padding: 0.5rem 0.75rem;
      font-family: monospace;
      font-size: 0.85rem;
      margin: 0;
      white-space: pre-wrap;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Matrix Header Bar -->
  <div class="admin-header">
    <div>
      <h1>Admin panel</h1>
      <p class="admin-subtitle">Administrative Control Terminal</p>
    </div>
    <a href="index.html" class="btn-back">BACK</a>
  </div>

  <!-- Operational Grid Sections -->
  <div class="matrix-grid">
    
    <!-- User Management Windows -->
    <div class="mc-panel">
      <h2 class="title-users">User Directory</h2>
      <div id="admin-users-list" class="scroll-box"></div>
    </div>
    
    <!-- Flag Interceptions Logs -->
    <div class="mc-panel">
      <h2 class="title-reports">Incoming Flag Interceptions</h2>
      <div id="admin-reports-list" class="scroll-box"></div>
    </div>
    
  </div>

  <script type="module" src="src/admin.ts"></script>
</body>
</html>
