<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://w3.org" xmlns:xlink="http://w3.org" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- SQUARE GLOBE (Deep Ocean Base) -->
  <rect x="2" y="2" width="28" height="28" fill="#1D4ED8" />

  <!-- PIXEL CONTINENTS (Greenery & Terrain) -->
  <!-- North America & Greenland -->
  <rect x="4" y="4" width="6" height="5" fill="#10B981" />
  <rect x="10" y="4" width="4" height="2" fill="#047857" />
  <rect x="5" y="9" width="3" height="3" fill="#10B981" />
  <!-- Europe & Asia -->
  <rect x="16" y="4" width="12" height="6" fill="#10B981" />
  <rect x="20" y="6" width="5" height="4" fill="#047857" />
  <rect x="14" y="7" width="4" height="3" fill="#10B981" />
  <!-- Africa -->
  <rect x="15" y="14" width="6" height="8" fill="#10B981" />
  <rect x="17" y="16" width="3" height="4" fill="#047857" />
  <!-- South America -->
  <rect x="6" y="16" width="5" height="9" fill="#10B981" />
  <rect x="7" y="18" width="3" height="5" fill="#047857" />
  <!-- Australia & Islands -->
  <rect x="24" y="18" width="4" height="4" fill="#10B981" />
  <rect x="25" y="19" width="2" height="2" fill="#047857" />

  <!-- STEVE'S 2D FACE (Centered 8x8 grid positioned at X=12, Y=12) -->
  <!-- Skin Tone Base -->
  <rect x="12" y="12" width="8" height="8" fill="#C49272" />
  
  <!-- Dark Brown Hair -->
  <rect x="12" y="12" width="8" height="2" fill="#4A2F1B" />
  <rect x="12" y="14" width="1" height="1" fill="#4A2F1B" />
  <rect x="19" y="14" width="1" height="1" fill="#4A2F1B" />
  
  <!-- Classic Purple Eyes -->
  <!-- Left Eye -->
  <rect x="13" y="15" width="1" height="1" fill="#FFFFFF" />
  <rect x="14" y="15" width="1" height="1" fill="#434399" />
  <!-- Right Eye -->
  <rect x="17" y="15" width="1" height="1" fill="#434399" />
  <rect x="18" y="15" width="1" height="1" fill="#FFFFFF" />
  
  <!-- Nose, Mouth & Beard -->
  <rect x="14" y="16" width="4" height="1" fill="#96583A" /> <!-- Nose -->
  <rect x="14" y="17" width="4" height="1" fill="#5C3A21" /> <!-- Mouth/Beard -->
  <rect x="13" y="17" width="1" height="2" fill="#5C3A21" /> <!-- Beard Sides -->
  <rect x="18" y="17" width="1" height="2" fill="#5C3A21" />
  <rect x="14" y="18" width="4" height="1" fill="#C49272" /> <!-- Chin under mouth -->

  <!-- OUTER BORDER -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#374151" stroke-width="1" />
</svg>

